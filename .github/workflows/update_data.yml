name: Daily Map Update

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes
  workflow_dispatch: # Allows manual trigger

jobs:
  update-map:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas requests openpyxl

      - name: Run Update Bot (Kobo Data)
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          KOBO_FORM_ID: ${{ secrets.KOBO_FORM_ID }}
        run: python3 scripts/ss_update_bot.py

      - name: Re-Process Data Layers
        run: |
          python3 scripts/ss_proc_population.py
          python3 scripts/ss_proc_schools_safe.py
          python3 scripts/ss_proc_conflict.py
          python3 scripts/ss_prep_map.py
          python3 scripts/ss_prep_conflict_map.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Education Risk Bot"
          git config --global user.email "bot@ebinitiative.org"
          git add data/
          
          # Check if there are changes to commit
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected. Committing and pushing..."
            git commit -m "Automated update: Synchronize field reports and refresh map layers"
            git push origin HEAD:main
          else
            echo "No changes detected. Skipping commit."
          fi
