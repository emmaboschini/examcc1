<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Sudan Education Facilities Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        #map { height: 100vh; width: 100%; background: #f0f0f0; }
        
        .map-header {
            position: absolute;
            top: 20px;
            left: 50px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .map-header h1 { margin: 0; font-size: 1.4rem; color: #1a1a1a; font-weight: 700; letter-spacing: -0.5px; }
        .map-header p { margin: 4px 0 0; font-size: 0.85rem; color: #666; font-weight: 500; }

        .filter-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            width: 240px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .filter-container h3 { margin: 0 0 15px; font-size: 0.95rem; color: #1a1a1a; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }

        .filter-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .filter-item:hover { background: rgba(0,0,0,0.03); transform: translateX(3px); }

        .filter-item input { margin-right: 12px; cursor: pointer; width: 18px; height: 18px; accent-color: #333; }

        .filter-item label { cursor: pointer; font-size: 0.85rem; color: #333; flex-grow: 1; font-weight: 500; }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            margin-right: 10px;
            display: inline-block;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
        }

        /* Custom Cluster Colors */
        .marker-cluster-small { background-color: rgba(181, 226, 140, 0.6); }
        .marker-cluster-small div { background-color: rgba(110, 204, 57, 0.6); }
        .marker-cluster-medium { background-color: rgba(241, 211, 87, 0.6); }
        .marker-cluster-medium div { background-color: rgba(240, 194, 12, 0.6); }
        .marker-cluster-large { background-color: rgba(253, 156, 115, 0.6); }
        .marker-cluster-large div { background-color: rgba(241, 128, 23, 0.6); }

        /* Custom Popup Style */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .leaflet-popup-content h4 { margin: 8px 0; color: #1a1a1a; font-size: 1.1rem; }
        .leaflet-popup-content p { margin: 6px 0; font-size: 0.8rem; color: #666; }
        .tag-container { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
        .type-tag {
            display: inline-block;
            padding: 3px 10px;
            background: #f0f2f5;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #4a5568;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="map-header">
        <h1>South Sudan Education</h1>
        <p>Interactive Infrastructure Map</p>
    </div>

    <div class="filter-container" id="filters">
        <h3>Filter Schools</h3>
        <!-- Filters will be generated dynamically -->
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script>
        // Initialize Map
        const map = L.map('map', {
            zoomControl: false
        }).setView([7.8627, 29.6949], 6);

        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        // Vibrant Base Map (CartoDB Voyager)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        const colorPalette = {
            "Primary School": "#FF5733",    // Vibrant Orange
            "Secondary School": "#33FF57",  // Vibrant Green
            "Nursery School": "#3357FF",    // Vibrant Blue
            "Vocational School": "#FF33F5", // Vibrant Magenta
            "University": "#FFD700",        // Gold
            "College": "#00CED1",           // Dark Turquoise
            "Other or Unknown": "#808080"   // Grey
        };

        const defaultColor = "#333333";

        let markers = L.markerClusterGroup({
            showCoverageOnHover: false,
            spiderfyOnMaxZoom: true,
            maxClusterRadius: 40,
            disableClusteringAtZoom: 14,
            iconCreateFunction: function(cluster) {
                var childCount = cluster.getChildCount();
                var c = ' marker-cluster-';
                if (childCount < 10) { c += 'small'; }
                else if (childCount < 50) { c += 'medium'; }
                else { c += 'large'; }
                return new L.DivIcon({ html: '<div><span>' + childCount + '</span></div>', className: 'marker-cluster' + c, iconSize: new L.Point(40, 40) });
            }
        });

        const activeFilters = new Set();
        let allFeatures = [];

        // Helper to extract types from a feature
        function getSchoolTypes(feature) {
            const typesSet = new Set();
            const primaryType = feature.properties.school_type;
            const name = (feature.properties.name || "").toLowerCase();

            // Split explicit types and clean them
            if (primaryType) {
                primaryType.split(',').forEach(t => {
                    const trimmed = t.trim();
                    if (trimmed && trimmed !== "0" && trimmed !== "null") {
                        typesSet.add(trimmed);
                    }
                });
            }

            // Check name for multi-type keywords
            const keywords = {
                "Primary": "Primary School",
                "Secondary": "Secondary School",
                "Nursery": "Nursery School",
                "Vocational": "Vocational School",
                "University": "University",
                "College": "College"
            };

            for (let [keyword, officialType] of Object.entries(keywords)) {
                if (name.includes(keyword.toLowerCase())) {
                    typesSet.add(officialType);
                }
            }
            
            // If it only had keywords but no explicit "Other or Unknown" and it was empty, 
            // the explicit check for keywords would have filled it.
            // If it's still empty, then it's Other or Unknown.
            const result = Array.from(typesSet);
            return result.length > 0 ? result : ["Other or Unknown"];
        }

        // Fetch Data
        fetch('maps/dots_education facilities.geojson')
            .then(response => response.json())
            .then(data => {
                allFeatures = data.features.map(f => {
                    f._detectedTypes = getSchoolTypes(f);
                    return f;
                });
                
                // Collect all unique types across all features
                const allPossibleTypes = new Set();
                allFeatures.forEach(f => f._detectedTypes.forEach(t => allPossibleTypes.add(t)));
                
                // Ensure "Other or Unknown" is always included if present in palette or data
                if (allFeatures.some(f => f._detectedTypes.includes("Other or Unknown"))) {
                    allPossibleTypes.add("Other or Unknown");
                }

                const sortedTypes = Array.from(allPossibleTypes).sort();
                
                // Initialize filters
                const filterContainer = document.getElementById('filters');
                sortedTypes.forEach(type => {
                    activeFilters.add(type);
                    
                    const div = document.createElement('div');
                    div.className = 'filter-item';
                    const color = colorPalette[type] || defaultColor;
                    
                    div.innerHTML = `
                        <input type="checkbox" checked id="type-${type.replace(/\s+/g, '-')}" value="${type}">
                        <span class="legend-color" style="background: ${color}"></span>
                        <label for="type-${type.replace(/\s+/g, '-')}">${type}</label>
                    `;
                    
                    div.querySelector('input').addEventListener('change', (e) => {
                        if (e.target.checked) activeFilters.add(type);
                        else activeFilters.delete(type);
                        updateMap();
                    });
                    
                    filterContainer.appendChild(div);
                });

                updateMap();
            });

        function updateMap() {
            markers.clearLayers();
            
            const filteredFeatures = allFeatures.filter(f => 
                f._detectedTypes.some(type => activeFilters.has(type))
            );
            
            const layer = L.geoJSON({
                type: "FeatureCollection",
                features: filteredFeatures
            }, {
                pointToLayer: (feature, latlng) => {
                    // Use the color of the first active type detected
                    const displayType = feature._detectedTypes.find(t => activeFilters.has(t)) || feature._detectedTypes[0];
                    const color = colorPalette[displayType] || defaultColor;
                    
                    return L.circleMarker(latlng, {
                        radius: 7,
                        fillColor: color,
                        color: "#fff",
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    });
                },
                onEachFeature: (feature, layer) => {
                    const props = feature.properties;
                    const tags = feature._detectedTypes.map(t => `<span class="type-tag">${t}</span>`).join('');
                    
                    layer.bindPopup(`
                        <h4>${props.name || 'Unnamed Facility'}</h4>
                        <div class="tag-container">${tags}</div>
                        <p><strong>Lat:</strong> ${feature.geometry.coordinates[1].toFixed(5)}<br>
                           <strong>Lon:</strong> ${feature.geometry.coordinates[0].toFixed(5)}</p>
                    `);
                }
            });

            markers.addLayer(layer);
            map.addLayer(markers);
        }
    </script>
</body>
</html>
