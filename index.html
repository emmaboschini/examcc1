<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Sudan Education Facilities</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100vw; height: 100vh; }
        .info-box {
            padding: 6px 8px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Initialize the map centered on South Sudan
    const map = L.map('map').setView([7.8627, 29.6950], 6);

    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Function to style and bind popups to each feature
    function onEachFeature(feature, layer) {
        let popupContent = `<strong>${feature.properties.name || "Unnamed Facility"}</strong><br>`;
        popupContent += `Type: ${feature.properties.amenity || "N/A"}<br>`;
        if (feature.properties["operator:type"]) {
            popupContent += `Operator: ${feature.properties["operator:type"]}<br>`;
        }
        if (feature.properties["addr:city"]) {
            popupContent += `Location: ${feature.properties["addr:city"]}`;
        }
        layer.bindPopup(popupContent);
    }

    // Load the GeoJSON data
    fetch('hotosm_ssd_education_facilities_points_geojson.geojson')
        .then(response => response.json())
        .then(data => {
            L.geoJSON(data, {
                onEachFeature: onEachFeature,
                pointToLayer: function (feature, latlng) {
                    // Custom marker color based on type
                    let color = "#3388ff"; // Default blue
                    if (feature.properties.amenity === 'university' || feature.properties.amenity === 'college') {
                        color = "#ff7800"; // Orange for higher ed
                    } else if (feature.properties.amenity === 'kindergarten') {
                        color = "#72ff00"; // Green for early ed
                    }

                    return L.circleMarker(latlng, {
                        radius: 6,
                        fillColor: color,
                        color: "#000",
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    });
                }
            }).addTo(map);
        })
        .catch(error => console.error('Error loading GeoJSON:', error));

</script>

</body>
</html>
