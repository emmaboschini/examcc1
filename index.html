<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Sudan Education Facilities Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; background: #262626; }
        
        .map-header {
            position: absolute;
            top: 20px;
            left: 50px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
        }

        .map-header h1 { margin: 0; font-size: 1.5rem; color: #333; }
        .map-header p { margin: 5px 0 0; font-size: 0.9rem; color: #666; }

        .filter-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 220px;
            backdrop-filter: blur(5px);
        }

        .filter-container h3 { margin: 0 0 15px; font-size: 1rem; color: #333; border-bottom: 1px solid #ddd; padding-bottom: 8px; }

        .filter-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-item:hover { transform: translateX(5px); }

        .filter-item input { margin-right: 12px; cursor: pointer; width: 16px; height: 16px; }

        .filter-item label { cursor: pointer; font-size: 0.9rem; color: #444; flex-grow: 1; }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            display: inline-block;
        }

        /* Custom Popup Style */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            padding: 5px;
        }
        .leaflet-popup-content h4 { margin: 5px 0; color: #2c3e50; }
        .leaflet-popup-content p { margin: 5px 0; font-size: 0.85rem; }
        .type-tag {
            display: inline-block;
            padding: 2px 8px;
            background: #e9ecef;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #495057;
        }
    </style>
</head>
<body>

    <div class="map-header">
        <h1>Education Facilities</h1>
        <p>South Sudan Infrastructure Overview</p>
    </div>

    <div class="filter-container" id="filters">
        <h3>Filter by Type</h3>
        <!-- Filters will be generated dynamically -->
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script>
        // Initialize Map
        const map = L.map('map').setView([7.8627, 29.6949], 6);

        // Professional Base Map (CartoDB Positron)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        const colors = {
            "Primary School": "#2ecc71",
            "Secondary School": "#3498db",
            "Nursery School": "#9b59b6",
            "Vocational School": "#e67e22",
            "University": "#e74c3c",
            "Other or Unknown": "#95a5a6"
        };

        const defaultColor = "#34495e";

        let geojsonLayer;
        let markers = L.markerClusterGroup({
            showCoverageOnHover: false,
            spiderfyOnMaxZoom: true
        });

        const activeFilters = new Set();
        let allFeatures = [];

        // Fetch Data
        fetch('maps/dots_education facilities.geojson')
            .then(response => response.json())
            .then(data => {
                allFeatures = data.features;
                
                // Get unique types
                const types = [...new Set(allFeatures.map(f => f.properties.school_type))].sort();
                
                // Initialize filters
                const filterContainer = document.getElementById('filters');
                types.forEach(type => {
                    activeFilters.add(type);
                    
                    const div = document.createElement('div');
                    div.className = 'filter-item';
                    const color = colors[type] || defaultColor;
                    
                    div.innerHTML = `
                        <input type="checkbox" checked id="type-${type}" value="${type}">
                        <span class="legend-color" style="background: ${color}"></span>
                        <label for="type-${type}">${type}</label>
                    `;
                    
                    div.querySelector('input').addEventListener('change', (e) => {
                        if (e.target.checked) activeFilters.add(type);
                        else activeFilters.delete(type);
                        updateMap();
                    });
                    
                    filterContainer.appendChild(div);
                });

                updateMap();
            });

        function updateMap() {
            markers.clearLayers();
            
            const filteredFeatures = allFeatures.filter(f => activeFilters.has(f.properties.school_type));
            
            const layer = L.geoJSON({
                type: "FeatureCollection",
                features: filteredFeatures
            }, {
                pointToLayer: (feature, latlng) => {
                    const type = feature.properties.school_type;
                    const color = colors[type] || defaultColor;
                    
                    return L.circleMarker(latlng, {
                        radius: 6,
                        fillColor: color,
                        color: "#fff",
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    });
                },
                onEachFeature: (feature, layer) => {
                    const props = feature.properties;
                    layer.bindPopup(`
                        <h4>${props.name || 'Unnamed Facility'}</h4>
                        <span class="type-tag">${props.school_type}</span>
                        <p>Location: ${feature.geometry.coordinates[1].toFixed(4)}, ${feature.geometry.coordinates[0].toFixed(4)}</p>
                    `);
                }
            });

            markers.addLayer(layer);
            map.addLayer(markers);
            
            if (filteredFeatures.length > 0) {
                // map.fitBounds(markers.getBounds(), { padding: [50, 50] });
            }
        }
    </script>
</body>
</html>
