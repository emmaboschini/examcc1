<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Sudan Education Facilities Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        #map { height: 100vh; width: 100%; background: #f0f0f0; }
        
        .overlay-panel {
            position: absolute;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3);
            max-height: 85vh;
            overflow-y: auto;
        }

        .map-header {
            top: 20px;
            left: 50px;
            padding: 15px 25px;
        }

        .map-header h1 { margin: 0; font-size: 1.4rem; color: #1a1a1a; font-weight: 700; letter-spacing: -0.5px; }
        .map-header p { margin: 4px 0 0; font-size: 0.85rem; color: #666; font-weight: 500; }

        .filter-container {
            top: 20px;
            right: 20px;
            width: 260px;
        }

        .filter-section { margin-bottom: 20px; }
        .filter-section h3 { 
            margin: 0 0 12px; 
            font-size: 0.85rem; 
            color: #1a1a1a; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            border-bottom: 2px solid #f0f0f0; 
            padding-bottom: 8px; 
        }

        .filter-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .filter-item:hover { background: rgba(0,0,0,0.03); transform: translateX(3px); }

        .filter-item input { margin-right: 12px; cursor: pointer; width: 16px; height: 16px; accent-color: #333; }

        .filter-item label { cursor: pointer; font-size: 0.8rem; color: #333; flex-grow: 1; font-weight: 500; }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            margin-right: 10px;
            display: inline-block;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
        }

        /* Custom Cluster Colors */
        .marker-cluster-small { background-color: rgba(181, 226, 140, 0.6); }
        .marker-cluster-small div { background-color: rgba(110, 204, 57, 0.6); }
        .marker-cluster-medium { background-color: rgba(241, 211, 87, 0.6); }
        .marker-cluster-medium div { background-color: rgba(240, 194, 12, 0.6); }
        .marker-cluster-large { background-color: rgba(253, 156, 115, 0.6); }
        .marker-cluster-large div { background-color: rgba(241, 128, 23, 0.6); }

        /* Custom Popup Style */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .leaflet-popup-content h4 { margin: 8px 0; color: #1a1a1a; font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .leaflet-popup-content p { margin: 6px 0; font-size: 0.8rem; color: #444; }
        .leaflet-popup-content .meta-info { color: #888; font-size: 0.75rem; margin-top: 10px; font-style: italic; }
        .tag-container { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
        .type-tag {
            display: inline-block;
            padding: 2px 8px;
            background: #f0f2f5;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #4a5568;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="overlay-panel map-header">
        <h1>South Sudan Education</h1>
        <p>Enriched Infrastructure Map (Clean Data v1.0)</p>
    </div>

    <div class="overlay-panel filter-container">
        <div class="filter-section" id="school-type-filters">
            <h3>School Types</h3>
            <!-- Filters will be generated dynamically -->
        </div>
        
        <div class="filter-section" id="operator-filters">
            <h3>Operator Type</h3>
            <!-- Filters will be generated dynamically -->
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script>
        // Initialize Map
        const map = L.map('map', {
            zoomControl: false
        }).setView([7.8627, 29.6949], 6);

        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        // Vibrant Base Map (CartoDB Voyager)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        const colorPalette = {
            "Primary School": "#FF5733",
            "Secondary School": "#33FF57",
            "Nursery School": "#3357FF",
            "Vocational School": "#FF33F5",
            "University": "#FFD700",
            "College": "#00CED1",
            "Other or Unknown": "#808080"
        };

        const defaultColor = "#333333";

        let markers = L.markerClusterGroup({
            showCoverageOnHover: false,
            spiderfyOnMaxZoom: true,
            maxClusterRadius: 45,
            disableClusteringAtZoom: 14,
            iconCreateFunction: function(cluster) {
                var childCount = cluster.getChildCount();
                var c = ' marker-cluster-';
                if (childCount < 10) { c += 'small'; }
                else if (childCount < 50) { c += 'medium'; }
                else { c += 'large'; }
                return new L.DivIcon({ html: '<div><span>' + childCount + '</span></div>', className: 'marker-cluster' + c, iconSize: new L.Point(40, 40) });
            }
        });

        const activeTypeFilters = new Set();
        const activeOperatorFilters = new Set();
        let allFeatures = [];

        // Helper to extract types from a feature using enriched properties
        function getSchoolTypes(feature) {
            const typesSet = new Set();
            const p = feature.properties;
            
            // Check enriched columns first
            ["school_type1", "school_type2", "school_type3", "school_type4", "school_type5"].forEach(key => {
                if (p[key] && p[key] !== "0") typesSet.add(p[key]);
            });

            // Fallback to legacy field
            if (p.school_type) {
                p.school_type.split(',').forEach(t => {
                    const trimmed = t.trim();
                    if (trimmed && trimmed !== "0" && trimmed !== "null") typesSet.add(trimmed);
                });
            }

            // Keyword fallback from name
            const name = (p.school_name || p.name || "").toLowerCase();
            const keywords = {
                "Primary": "Primary School", "Secondary": "Secondary School", 
                "Nursery": "Nursery School", "Vocational": "Vocational School", 
                "University": "University", "College": "College"
            };

            for (let [keyword, officialType] of Object.entries(keywords)) {
                if (name.includes(keyword.toLowerCase())) typesSet.add(officialType);
            }
            
            const result = Array.from(typesSet);
            return result.length > 0 ? result : ["Other or Unknown"];
        }

        // Fetch Enriched Data
        fetch('maps/enriched_education_facilities.geojson')
            .then(response => response.json())
            .then(data => {
                allFeatures = data.features.map(f => {
                    f._detectedTypes = getSchoolTypes(f);
                    f._operator = f.properties.operator_type || "Unknown";
                    // Handle weird CSV header keys
                    f._city = f.properties["addr_city,C,80"] || f.properties.addr_city || "Not Specified";
                    return f;
                });
                
                const allTypes = new Set();
                const allOperators = new Set();
                allFeatures.forEach(f => {
                    f._detectedTypes.forEach(t => allTypes.add(t));
                    allOperators.add(f._operator);
                });

                // Initialize School Type Filters
                const typeContainer = document.getElementById('school-type-filters');
                Array.from(allTypes).sort().forEach(type => {
                    activeTypeFilters.add(type);
                    const color = colorPalette[type] || defaultColor;
                    createFilterItem(typeContainer, type, color, activeTypeFilters);
                });

                // Initialize Operator Filters
                const operatorContainer = document.getElementById('operator-filters');
                Array.from(allOperators).sort().forEach(op => {
                    activeOperatorFilters.add(op);
                    createFilterItem(operatorContainer, op, '#555', activeOperatorFilters);
                });

                updateMap();
            });

        function createFilterItem(container, label, color, filterSet) {
            const div = document.createElement('div');
            div.className = 'filter-item';
            const safeId = label.replace(/\s+/g, '-').toLowerCase();
            
            div.innerHTML = `
                <input type="checkbox" checked id="filter-${safeId}">
                <span class="legend-color" style="background: ${color}"></span>
                <label for="filter-${safeId}">${label}</label>
            `;
            
            div.querySelector('input').addEventListener('change', (e) => {
                if (e.target.checked) filterSet.add(label);
                else filterSet.delete(label);
                updateMap();
            });
            
            container.appendChild(div);
        }

        function updateMap() {
            markers.clearLayers();
            
            const filteredFeatures = allFeatures.filter(f => 
                f._detectedTypes.some(type => activeTypeFilters.has(type)) &&
                activeOperatorFilters.has(f._operator)
            );
            
            const layer = L.geoJSON({
                type: "FeatureCollection",
                features: filteredFeatures
            }, {
                pointToLayer: (feature, latlng) => {
                    const displayType = feature._detectedTypes.find(t => activeTypeFilters.has(t)) || feature._detectedTypes[0];
                    const color = colorPalette[displayType] || defaultColor;
                    
                    return L.circleMarker(latlng, {
                        radius: 7,
                        fillColor: color,
                        color: "#fff",
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    });
                },
                onEachFeature: (feature, layer) => {
                    const p = feature.properties;
                    const tags = feature._detectedTypes.map(t => `<span class="type-tag">${t}</span>`).join('');
                    
                    layer.bindPopup(`
                        <h4>${p.school_name || p.name || 'Unnamed Facility'}</h4>
                        <div class="tag-container">${tags}</div>
                        <p><strong>Operator:</strong> ${feature._operator}</p>
                        <p><strong>City/Area:</strong> ${feature._city}</p>
                        <div class="meta-info">
                            Source: ${p["source,C,80"] || "OpenStreetMap"}<br>
                            OSM ID: ${p["osm_id,N,18,0"] || "N/A"}
                        </div>
                    `);
                }
            });

            markers.addLayer(layer);
            map.addLayer(markers);
        }
    </script>
</body>
</html>
