<!DOCTYPE html>
<html>
<head>
    <title>Education Access Monitor | South Sudan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent-yellow: #fbbf24;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main);
            overflow: hidden;
        }
        #map { height: 100vh; width: 100vw; background: var(--bg-dark); }
        
        .overlay-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: #1e293b;
            padding: 20px; border-radius: 8px; width: 300px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { margin: 0 0 8px 0; font-size: 1rem; font-weight: 600; color: white; }
        .subtitle { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 20px; line-height: 1.4; }
        
        .control-group { margin-bottom: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .label-header { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; display: block; }
        
        .legend-item { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 0.75rem; color: var(--text-dim); }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .square { width: 10px; height: 10px; border-radius: 2px; }

        .leaflet-popup-content-wrapper { background: var(--panel-bg); color: var(--text-main); border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
        .leaflet-popup-tip { background: var(--panel-bg); }
        .leaflet-container a { color: var(--accent-blue); font-weight: 600; }
    </style>
</head>
<body>
    <div class="overlay-panel">
        <h1>Education Access Monitor</h1>
        <p class="subtitle">Security event monitoring for <b>Education Bridge Initiative</b> schools. Data focused on Juba & Bor campuses.</p>
        
        <div class="control-group">
            <span class="label-header">Map Legend</span>
            <div class="legend-item"><div class="square" style="background: var(--accent-blue)"></div> Greenbelt Academy Campus</div>
            <div class="legend-item"><div class="dot" style="background: var(--accent-yellow)"></div> Security Incident Report</div>
        </div>

        <div class="control-group" style="margin-bottom:0;">
            <p style="font-size: 0.7rem; color: var(--text-dim);">
                Static markers used for maximum stability.
            </p>
        </div>
    </div>

    <div id="map"></div>

    <script>
        // Initialize map with basic settings, disabling all animation for stability
        var map = L.map('map', {
            zoomControl: false,
            fadeAnimation: false,
            markerZoomAnimation: false,
            transform3DLimit: 0
        }).setView([5.8, 31.5], 8);
        
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO',
            updateWhenIdle: true
        }).addTo(map);

        // School Locations (Greenbelt Academy)
        var schools = [
            { name: "Greenbelt Academy - Juba", coords: [4.88, 31.63], details: "Shirikat, Juba." },
            { name: "Greenbelt Academy - Bor", coords: [6.21, 31.55], details: "Bor, Jonglei." }
        ];

        schools.forEach(school => {
            L.circleMarker(school.coords, {
                radius: 10, 
                fillColor: "#38bdf8", 
                color: "white", 
                weight: 2, 
                opacity: 1, 
                fillOpacity: 0.8
            }).addTo(map).bindPopup("<b>" + school.name + "</b><br>" + school.details);
        });

        var eventLayer = L.layerGroup().addTo(map);

        async function fetchDetailedEvents() {
            try {
                const response = await fetch('events_detailed.json?t=' + new Date().getTime());
                const events = await response.json();
                eventLayer.clearLayers();
                
                events.forEach(event => {
                    if (event.lat && event.lng) {
                        // Standard static circle marker - zero CSS movement
                        var dot = L.circleMarker([event.lat, event.lng], {
                            radius: 7, 
                            fillColor: "#fbbf24", 
                            color: "white", 
                            weight: 1, 
                            opacity: 1, 
                            fillOpacity: 1
                        }).addTo(eventLayer);

                        dot.bindPopup(`
                            <div style="min-width: 180px;">
                                <b style="color: white;">${event.type}</b><br>
                                <span style="color:#94a3b8; font-size: 0.8em;">${event.date}</span><br>
                                <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin: 5px 0;">
                                <p style="margin: 0; font-size: 0.85em;">${event.location}</p>
                                <br>
                                <a href="${event.source}" target="_blank">View Report &rarr;</a>
                            </div>
                        `);
                    }
                });
            } catch (e) { console.log("Data load error:", e); }
        }

        fetchDetailedEvents();
    </script>
</body>
</html>
