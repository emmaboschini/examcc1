<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Sudan: Risk Assessment Map (Population, Schools & Conflict)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; }
        
        /* UI Controls */
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            width: 250px;
        }
        .ui-panel h3 { margin-top: 0; font-size: 16px; color: #333; }
        select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
        
        .info {
            padding: 10px 15px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        .legend { line-height: 18px; color: #555; background: white; padding: 10px; }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.7; }
        
        /* Risk Marker Style */
        .risk-popup { text-align: center; }
        .risk-popup h2 { margin: 0; color: #d9534f; font-size: 18px; }
        
    </style>
</head>
<body>

<div class="ui-panel">
    <h3>Filter by Region</h3>
    <select id="stateFilter">
        <option value="All">All of South Sudan</option>
    </select>
    <div id="riskSummary" style="margin-top: 15px; display: none;">
        <hr>
        <p><b>State Risk Summary:</b></p>
        <p id="riskText">No selected state.</p>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const map = L.map('map').setView([7.8, 30.0], 6);

    // Panes for layer ordering
    map.createPane('polygonsPane');
    map.getPane('polygonsPane').style.zIndex = 400;
    
    map.createPane('schoolsPane');
    map.getPane('schoolsPane').style.zIndex = 650;
    
    map.createPane('conflictPane');
    map.getPane('conflictPane').style.zIndex = 700;

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; CARTO'
    }).addTo(map);

    // --- 1. DATA LAYERS ---
    const populationLayer = L.layerGroup();
    const schoolsLayer = L.layerGroup();
    const conflictLayer = L.layerGroup();

    // Store references for filtering
    let stateData = [];
    let schoolMarkers = [];
    let popGeoJSON;

    // --- 2. POPULATION GRADIENTS ---
    function getColor(d) {
        return d > 200000 ? '#800026' : d > 150000 ? '#BD0026' : d > 100000 ? '#E31A1C' :
               d > 50000  ? '#FC4E2A' : d > 20000  ? '#FD8D3C' : d > 10000  ? '#FEB24C' :
               d > 5000   ? '#FED976' : '#FFEDA0';
    }

    // --- 3. CONFLICT LAYER (States with Stats) ---
    fetch('data/clean/ss_conflict_map_data.geojson')
        .then(res => res.json())
        .then(data => {
            stateData = data.features;
            
            // Fill the filter dropdown
            const filter = document.getElementById('stateFilter');
            stateData.sort((a,b) => a.properties.shapeName.localeCompare(b.properties.shapeName))
                     .forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.properties.shapeName;
                opt.textContent = f.properties.shapeName;
                filter.appendChild(opt);
            });

            // Add conflict indicators (only where incidents > 0)
            L.geoJson(data, {
                pane: 'conflictPane',
                pointToLayer: function (feature, latlng) {
                    if (feature.properties.incidents > 0) {
                        return L.circleMarker(latlng, {
                            radius: 12,
                            fillColor: "#ff0000",
                            color: "#000",
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.6
                        });
                    }
                },
                onEachFeature: function(feature, layer) {
                    if (feature.properties.incidents > 0) {
                        layer.bindPopup(`
                            <div class="risk-popup">
                                <h2>⚠️ High Risk Area</h2>
                                <b>${feature.properties.shapeName}</b><hr>
                                <p>Reported Attacks on Schools: <b>${feature.properties.incidents}</b></p>
                                <p>Educators Killed: ${feature.properties.educators_killed}</p>
                                <p>Students Killed: ${feature.properties.students_killed}</p>
                            </div>
                        `);
                        layer.addTo(conflictLayer);
                    }
                }
            });
            conflictLayer.addTo(map);
        });

    // --- 4. SCHOOLS LAYER ---
    fetch('data/clean/ss_clean_schools_geo.csv')
        .then(res => res.text())
        .then(csv => {
            const lines = csv.split('\n').slice(1);
            lines.forEach(line => {
                const p = line.split(',');
                if (p.length >= 6) {
                    const marker = L.circleMarker([parseFloat(p[4]), parseFloat(p[5])], {
                        radius: 3, fillColor: "#0078ff", color: "#fff", weight: 1, opacity: 1, fillOpacity: 0.8, pane: 'schoolsPane'
                    }).bindPopup(`<b>${p[0]}</b><br>State: ${p[2]}<br>Type: ${p[1]}`);
                    marker.state = p[2]; // Attach state for filtering
                    schoolMarkers.push(marker);
                    marker.addTo(schoolsLayer);
                }
            });
            schoolsLayer.addTo(map);
        });

    // --- 5. POPULATION LAYER ---
    fetch('data/clean/ss_map_data.geojson')
        .then(res => res.json())
        .then(data => {
            popGeoJSON = L.geoJson(data, {
                pane: 'polygonsPane',
                style: f => ({
                    fillColor: getColor(f.properties.population),
                    weight: 1, opacity: 1, color: 'white', fillOpacity: 0.7
                }),
                onEachFeature: (f, l) => {
                    l.bindTooltip(`<b>${f.properties.shapeName}</b><br>${f.properties.population.toLocaleString()} children`);
                }
            }).addTo(populationLayer);
            populationLayer.addTo(map);
        });

    // --- 6. FILTERING LOGIC ---
    document.getElementById('stateFilter').addEventListener('change', function(e) {
        const selectedState = e.target.value;
        const summaryPanel = document.getElementById('riskSummary');
        const riskText = document.getElementById('riskText');

        if (selectedState === "All") {
            map.setView([7.8, 30.0], 6);
            schoolMarkers.forEach(m => m.addTo(schoolsLayer));
            summaryPanel.style.display = 'none';
        } else {
            // Find selected state bounds and conflict info
            const feature = stateData.find(f => f.properties.shapeName === selectedState);
            if (feature) {
                const bounds = L.geoJson(feature).getBounds();
                map.fitBounds(bounds);
                
                // Show risk summary
                summaryPanel.style.display = 'block';
                riskText.innerHTML = `
                    Incidents: <b>${feature.properties.incidents}</b><br>
                    Fatalities: <b>${feature.properties.educators_killed + feature.properties.students_killed}</b>
                `;
            }

            // Filter schools
            schoolMarkers.forEach(m => {
                if (m.state === selectedState) {
                    m.addTo(schoolsLayer);
                } else {
                    schoolsLayer.removeLayer(m);
                }
            });
        }
    });

    // --- 7. LEGEND & CONTROLS ---
    const overlayMaps = {
        "Population Density": populationLayer,
        "School Locations": schoolsLayer,
        "Conflict Risk Indicators": conflictLayer
    };
    L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);

    const legend = L.control({position: 'bottomright'});
    legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'info legend');
        const grades = [0, 5000, 10000, 20000, 50000, 100000, 150000, 200000];
        div.innerHTML = '<h4>Children Under 17</h4>';
        for (let i = 0; i < grades.length; i++) {
            div.innerHTML += '<i style="background:' + getColor(grades[i] + 1) + '"></i> ' +
                grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
        }
        return div;
    };
    legend.addTo(map);

</script>

</body>
</html>
